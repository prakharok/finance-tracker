<div class="auth-shell">
  <div class="card">
    <h2>Create Account</h2>

    <div class="alert error" *ngIf="error">{{ error }}</div>
    <div class="alert success" *ngIf="success">{{ success }}</div>

    <form *ngIf="step === 'form'" (ngSubmit)="submitSignup()">
      <div class="field">
        <label>Username</label>
        <input type="text" [(ngModel)]="username" name="username" required />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required minlength="6" />
      </div>
      <button class="btn" type="submit" [disabled]="loading">{{ loading ? 'Please wait...' : 'Sign Up' }}</button>
    </form>

    <form *ngIf="step === 'otp'" (ngSubmit)="submitOtp()">
      <p>Enter the OTP sent to <strong>{{ email }}</strong></p>
      <div class="field">
        <label>OTP</label>
        <input type="text" [(ngModel)]="otp" name="otp" maxlength="6" required />
      </div>
      <button class="btn" type="submit" [disabled]="loading">{{ loading ? 'Verifying...' : 'Verify' }}</button>
    </form>

    <div class="link-row">Already have an account? <a routerLink="/signin">Sign in</a></div>
  </div>
</div>
