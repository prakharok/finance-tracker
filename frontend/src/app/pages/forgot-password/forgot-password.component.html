<div class="auth-shell">
  <div class="card">
    <h2>Forgot Password</h2>

    <div class="alert error" *ngIf="error">{{ error }}</div>
    <div class="alert success" *ngIf="success">{{ success }}</div>

    <form *ngIf="step === 'request'" (ngSubmit)="requestOtp()">
      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required />
      </div>
      <button class="btn" type="submit" [disabled]="loading">{{ loading ? 'Sending...' : 'Send OTP' }}</button>
    </form>

    <form *ngIf="step === 'reset'" (ngSubmit)="resetPassword()">
      <p>Enter the OTP sent to <strong>{{ email }}</strong> and choose a new password</p>
      <div class="field">
        <label>OTP</label>
        <input type="text" [(ngModel)]="otp" name="otp" maxlength="6" required />
      </div>
      <div class="field">
        <label>New Password</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" required minlength="6" />
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required />
      </div>
      <button class="btn" type="submit" [disabled]="loading">{{ loading ? 'Resetting...' : 'Reset Password' }}</button>
    </form>

    <div class="link-row"><a routerLink="/signin">Back to sign in</a></div>
  </div>
</div>
