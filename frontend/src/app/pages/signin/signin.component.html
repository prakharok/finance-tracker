<div class="auth-shell">
  <div class="card">
    <h2>Sign In</h2>

    <div class="alert error" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="submit()">
      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="email" name="email" required />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" required />
      </div>
      <button class="btn" type="submit" [disabled]="loading">{{ loading ? 'Signing in...' : 'Sign In' }}</button>
    </form>

    <div class="link-row"><a routerLink="/forgot-password">Forgot password?</a></div>
    <div class="link-row">Don't have an account? <a routerLink="/signup">Sign up</a></div>
  </div>
</div>
